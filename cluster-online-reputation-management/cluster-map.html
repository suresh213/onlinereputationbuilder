<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cluster Map: Online Reputation Management</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; padding: 2rem; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { color: #0f172a; text-align: center; }
        .node { transition: all 0.2s; }
        .node:hover { filter: brightness(1.1); cursor: pointer; }
        .node text { font-size: 12px; fill: white; font-weight: 500; text-anchor: middle; pointer-events: none; }
        .link { stroke: #cbd5e1; stroke-width: 2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Topic Cluster: Online Reputation Management</h1>
        <svg width="100%" height="600" viewBox="0 0 800 600">
            <!-- Links -->
            <line class="link" x1="400" y1="300" x2="200" y2="150"/>
            <line class="link" x1="400" y1="300" x2="600" y2="150"/>
            <line class="link" x1="400" y1="300" x2="400" y2="500"/>
            
            <!-- Pillar -->
            <g class="node" transform="translate(400,300)">
                <circle r="60" fill="#0f172a"/>
                <text y="-5">ORM</text>
                <text y="15">Pillar</text>
                <title>The Ultimate Guide to Online Reputation Management</title>
            </g>
            
            <!-- Clusters -->
            <g class="node" transform="translate(200,150)">
                <circle r="45" fill="#e11d48"/>
                <text y="5">Review Removal</text>
                <title>High Intent Lead Generation</title>
            </g>
            <g class="node" transform="translate(600,150)">
                <circle r="45" fill="#2563eb"/>
                <text y="5">PR & Crisis</text>
                <title>Enterprise Corporate Leads</title>
            </g>
            <g class="node" transform="translate(400,500)">
                <circle r="45" fill="#16a34a"/>
                <text y="5">Personal Brand</text>
                <title>Executive Protection</title>
            </g>
        </svg>
    </div>
</body>
</html>
