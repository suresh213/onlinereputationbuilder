name: Supabase Free Tier Keep-Alive Ping

on:
  schedule:
    # Run every 3 days at 00:00 UTC to prevent Supabase 7-day auto-pause
    - cron: "0 0 */3 * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive API Endpoint
        run: |
          echo "Sending keep-alive ping to website cron endpoint..."
          curl -s -f "https://onlinereputationbuilders.in/api/cron/keep-alive" || echo "Ping dispatched"
          echo "Keep-alive ping completed successfully."
