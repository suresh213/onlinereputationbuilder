name: Supabase Free Tier Keep-Alive Ping

on:
  schedule:
    # Run every 3 days at 00:00 UTC to prevent Supabase 7-day auto-pause
    - cron: "0 0 */3 * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Endpoint
        run: |
          echo "Sending keep-alive ping to Supabase..."
          curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_sCFNOVamGc13F1uJSUVXjg_iQHEtcW7" \
            -H "Authorization: Bearer sb_publishable_sCFNOVamGc13F1uJSUVXjg_iQHEtcW7" \
            "https://couzgedvfinutcvciryf.supabase.co/rest/v1/contact_submissions?select=id&limit=1"
          echo "Keep-alive ping completed successfully."
